[package]
name = "etudition-engine"
description = "MIDI、クリック、時計、記録、流し込み。Tauri を持たない"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# 依存は人間が承認した（2026-11-26「1a-4 と 1a-3 の依存（rtrb、midly、serde_json、insta、sha2）を足してよい」）
[dependencies]
etudition-core = { path = "../core" }
# コールバックから練習のスレッドへの、待たないリングバッファ（ADR-0001）
rtrb = "=0.4.1"
# MIDI ファイルの読み書き。parallel（rayon）は使わない
midly = { version = "=0.5.3", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# お手本のハッシュ（楽譜のファイルのバイト列の SHA-256。BQ-02）
sha2 = { version = "=0.11.1", default-features = false }
# クリックの音（1a-5）。人間が承認した（2026-11-26「二つについては承認します」。cpal 0.18.2）
cpal = "=0.18.2"
# 実際の MIDI の入力（1a-8）。人間が承認した（2026-11-26「二つについては承認します」。midir 0.11.1）
midir = "=0.11.1"
