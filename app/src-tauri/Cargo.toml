[package]
name = "etudition-app"
description = "Tauri の殻。配線だけ"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
ts-rs = "=12.0.1"
etudition-core = { path = "../../crates/core" }
etudition-engine = { path = "../../crates/engine" }

[features]
# 開発用のビルドだけ：MIDI ファイルの流し込みのコマンド（REQ-106、AC-23）。`cargo tauri dev --features dev-feed`
dev-feed = []

[dev-dependencies]
# 本物のコマンドの登録と Channel を通す試験（tauri の feature `test`。依存は増えない）
tauri = { version = "=2.12.7", features = ["test"] }
serde_json = "=1.0.154"
midly = { version = "=0.5.3", default-features = false, features = ["std"] }

[lints]
workspace = true
